<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #181818;
            --surface: #282828;
            --surface-hover: #3ea6ff1a;
            --border: #3d3d3d;
            --text: #f1f1f1;
            --text-muted: #aaaaaa;
            --accent: #cc0000;
            --success: #2ba640;
        }

        body {
            width: 260px;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        h3 {
            margin: 0 0 20px 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-align: center;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-row span {
            font-size: 14px;
        }

        /* Minimalist toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        /* Upload groups */
        .group {
            margin-bottom: 18px;
        }

        .group:last-child {
            margin-bottom: 0;
        }

        .group-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        /* Custom file button */
        input[type="file"] {
            display: none;
        }

        .file-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            text-align: center;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-btn:hover {
            background: var(--surface-hover);
            border-color: #3ea6ff;
            color: #3ea6ff;
        }

        .status {
            font-size: 11px;
            margin-top: 6px;
            min-height: 14px;
            text-align: center;
            transition: opacity 0.3s ease;
            opacity: 0;
            color: var(--success);
        }

        .status.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <h3>boost your ego</h3>

    <div class="header-row">
        <span>Replacement active</span>
        <label class="switch">
            <input type="checkbox" id="toggleExt">
            <span class="slider"></span>
        </label>
    </div>

    <div class="group">
        <span class="group-title">For regular videos</span>
        <label class="file-btn" for="uploadHorizontal" id="labelHorizontal">Choose file</label>
        <input type="file" id="uploadHorizontal" accept="image/png, image/jpeg, image/webp">
        <div class="status" id="statusHorizontal">✓ Saved</div>
    </div>

    <div class="group">
        <span class="group-title">For Shorts</span>
        <label class="file-btn" for="uploadVertical" id="labelVertical">Choose file</label>
        <input type="file" id="uploadVertical" accept="image/png, image/jpeg, image/webp">
        <div class="status" id="statusVertical">✓ Saved</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
